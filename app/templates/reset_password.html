{% extends "base.html" %}

{% block title %}Reset password · ClassSwap{% endblock %}

{% block body %}
<main class="auth-wrap">
  <section class="auth-card" aria-labelledby="reset-heading">
    <div class="brand auth-brand">
      <span class="brand-mark" aria-hidden="true">CS</span>
      <span class="brand-name">ClassSwap<span class="brand-tag">CAMPUS COVERAGE</span></span>
    </div>
    <h1 id="reset-heading">Set a new password</h1>
    <p class="subtitle">Choose a unique password with at least 12 characters.</p>
    <form class="form-grid" id="reset-form">
      <label class="field" for="new-password">New password
        <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
      </label>
      <button class="button" type="submit">Update password</button>
      <p class="notice" id="reset-message" role="status" hidden></p>
    </form>
  </section>
</main>
<script nonce="{{ request.state.csp_nonce }}">
  const form = document.getElementById("reset-form");
  const message = document.getElementById("reset-message");
  const token = decodeURIComponent(window.location.hash.slice(1));
  window.history.replaceState(null, "", window.location.pathname);
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const response = await fetch("/auth/password-reset/confirm", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRF-Token": window.classSwapCsrfToken()
      },
      body: JSON.stringify({ token, new_password: form.new_password.value }),
    });
    message.hidden = false;
    message.textContent = response.ok
      ? "Your password was updated. Sign in with your new password."
      : "This reset link is invalid or expired, or the password needs attention.";
  });
</script>
{% endblock %}
