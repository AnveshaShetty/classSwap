{% extends "base.html" %}
{% block title %}Page not found · ClassSwap{% endblock %}
{% block body %}
<main class="auth-wrap">
  <section class="auth-card error-card" aria-labelledby="error-title">
    <span class="error-code">404</span>
    <p class="eyebrow">Nothing in this address</p>
    <h1 id="error-title">We couldn’t find that page.</h1>
    <p class="subtitle">The link may be outdated or the schedule may have moved. Return to the dashboard to continue.</p>
    <a class="button" href="/dashboard">Return to dashboard</a>
  </section>
</main>
{% endblock %}
