name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check app scripts migrations tests data
      - name: Type check
        run: python -m mypy app scripts
      - name: Bandit
        run: python -m bandit -q -r app scripts migrations data --severity-level high
      - name: pip-audit
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-dev.txt
          python -m pip_audit -r data/requirements.txt
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" \
            semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1 \
            semgrep scan --config p/python --config p/fastapi --config p/security-audit \
            --config /src/.semgrep/jinja.yml --error /src/app
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/path" -w /path \
            zricethezav/gitleaks:v8.29.0@sha256:71d3ee5990f2176f763b438298453fc37e87b119122045e176ca9d44ff00b08b \
            git --redact
      - name: Build container
        run: docker build --tag classswap:ci .
      - name: Scan container
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --exit-code 1 --severity HIGH,CRITICAL classswap:ci
