{% extends "base.html" %}

{% block title %}Sign In — ClassSwap{% endblock %}

{% block public_content %}
<div class="min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-200">
        <!-- Brand Header -->
        <div class="text-center">
            <div class="inline-flex w-12 h-12 rounded-2xl bg-brand-600 text-white items-center justify-center font-bold shadow-lg shadow-brand-500/30 mb-4">
                <i data-lucide="calendar-sync" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-navy-900 tracking-tight">Sign in to ClassSwap</h2>
            <p class="text-xs text-slate-500 mt-1 font-medium">{{ college_name }}</p>
        </div>

        {% if error %}
        <div class="p-3.5 rounded-xl bg-red-50 border border-red-200 text-xs font-semibold text-red-700 flex items-center">
            <i data-lucide="alert-circle" class="w-4 h-4 mr-2 text-red-600 flex-shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        {% if msg %}
        <div class="p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-xs font-semibold text-emerald-700 flex items-center">
            <i data-lucide="check-circle" class="w-4 h-4 mr-2 text-emerald-600 flex-shrink-0"></i>
            <span>{{ msg }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form class="mt-6 space-y-4" action="/auth/login-form" method="POST">
            <div>
                <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Institutional Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </div>
                    <input id="email" name="email" type="email" required autocomplete="email" placeholder="name@classswap.edu" class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </div>
                    <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs pt-1">
                <label class="flex items-center text-slate-600">
                    <input type="checkbox" checked class="h-4 w-4 text-brand-600 focus:ring-brand-500 border-slate-300 rounded">
                    <span class="ml-2">Remember on this device</span>
                </label>
                <span class="text-slate-400">Protected by JWT</span>
            </div>

            <button type="submit" class="w-full mt-4 flex justify-center items-center py-3 px-4 border border-transparent rounded-xl text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 shadow-md shadow-brand-500/25 transition-all">
                <i data-lucide="log-in" class="w-4 h-4 mr-2"></i> Sign In to Portal
            </button>
        </form>

        <!-- Quick Demo Accounts Auto-fill -->
        <div class="pt-6 border-t border-slate-200">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 text-center">
                Instant Hackathon Demo Auto-Fill
            </p>
            <div class="space-y-2">
                <button type="button" onclick="autoFill('admin@classswap.edu', 'Admin@123')" class="w-full text-left p-2.5 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 transition-colors flex items-center justify-between group">
                    <div class="flex items-center space-x-2.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-brand-600"></span>
                        <div>
                            <p class="text-xs font-bold text-navy-900 group-hover:text-brand-600">HOD / Admin Persona</p>
                            <p class="text-[11px] text-slate-500">admin@classswap.edu</p>
                        </div>
                    </div>
                    <span class="text-[11px] font-semibold text-brand-600">Click to Fill &rarr;</span>
                </button>

                <button type="button" onclick="autoFill('rajesh.kumar@classswap.edu', 'Faculty@123')" class="w-full text-left p-2.5 rounded-xl border border-slate-200 hover:border-teal-500 hover:bg-teal-50/50 transition-colors flex items-center justify-between group">
                    <div class="flex items-center space-x-2.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-teal-600"></span>
                        <div>
                            <p class="text-xs font-bold text-navy-900 group-hover:text-teal-600">Absent Faculty Persona (Dr. Rajesh Kumar)</p>
                            <p class="text-[11px] text-slate-500">rajesh.kumar@classswap.edu</p>
                        </div>
                    </div>
                    <span class="text-[11px] font-semibold text-teal-600">Click to Fill &rarr;</span>
                </button>

                <button type="button" onclick="autoFill('priya.nair@classswap.edu', 'Faculty@123')" class="w-full text-left p-2.5 rounded-xl border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/50 transition-colors flex items-center justify-between group">
                    <div class="flex items-center space-x-2.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
                        <div>
                            <p class="text-xs font-bold text-navy-900 group-hover:text-emerald-600">Top Substitute Persona (Dr. Priya Nair)</p>
                            <p class="text-[11px] text-slate-500">priya.nair@classswap.edu</p>
                        </div>
                    </div>
                    <span class="text-[11px] font-semibold text-emerald-600">Click to Fill &rarr;</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function autoFill(email, password) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = password;
        showToast(`Filled credentials for ${email}`, 'info');
    }
</script>
{% endblock %}
