services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classswap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classswap}
      POSTGRES_DB: ${POSTGRES_DB:-classswap}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classswap} -d ${POSTGRES_DB:-classswap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-classswap}:${POSTGRES_PASSWORD:-classswap}@db:5432/${POSTGRES_DB:-classswap}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-key-change-me-32chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
